<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--surface-2:#E9EDE9;--ink:#16212B;--muted:#56636E;--line:#D5DBD6;
  --brand:#0B6E5F;--brand-ink:#FFFFFF;
  --agent:#4A4EC0;--team:#0B6E5F;--company:#2B5A86;--hm:#8A3B77;--cand:#2C7A47;
  --warn:#9A6210;--bad:#B23A3A;--good:#2C7A47;--focus:#4A4EC0;
  --rail:#16212B;--rail-ink:#E6ECEF;--rail-muted:#9AA8B3;--rail-hover:#223140;
  --slack-side:#2A2338;--slack-ink:#EDE7F3;--slack-muted:#B6A9C6;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161B;--surface:#172028;--surface-2:#1F2A33;--ink:#E6ECEF;--muted:#9AA8B3;--line:#2B3842;
    --brand:#3CB49E;--brand-ink:#06201B;
    --agent:#9497F2;--team:#3CB49E;--company:#7FB1E0;--hm:#D78EC6;--cand:#6CC48D;
    --warn:#E3AA4C;--bad:#F07C7C;--good:#6CC48D;--focus:#9497F2;
    --rail:#0B1014;--rail-ink:#E6ECEF;--rail-muted:#8C99A4;--rail-hover:#1A242D;
    --slack-side:#1C1726;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161B;--surface:#172028;--surface-2:#1F2A33;--ink:#E6ECEF;--muted:#9AA8B3;--line:#2B3842;
  --brand:#3CB49E;--brand-ink:#06201B;
  --agent:#9497F2;--team:#3CB49E;--company:#7FB1E0;--hm:#D78EC6;--cand:#6CC48D;
  --warn:#E3AA4C;--bad:#F07C7C;--good:#6CC48D;--focus:#9497F2;
  --rail:#0B1014;--rail-ink:#E6ECEF;--rail-muted:#8C99A4;--rail-hover:#1A242D;
  --slack-side:#1C1726;color-scheme:dark;
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;padding:0 8px 18px}
.rail h4{margin:4px 8px 6px;font-size:12px;font-weight:600;color:var(--rail-muted)}
.seat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--rail-ink);padding:8px;border-radius:8px}
.seat:hover{background:var(--rail-hover)}
.seat[aria-pressed="true"]{background:var(--rail-hover);box-shadow:inset 3px 0 0 var(--brand)}
.seat .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.seat .av svg{width:16px;height:16px}
.seat .lbl{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.seat .lbl b{font-size:14px;font-weight:600}
.seat .lbl small{color:var(--rail-muted);font-size:12px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;flex:none}
.railfoot{margin-top:auto;border-top:1px solid var(--rail-hover);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.railfoot .today{font-size:12px;color:var(--rail-muted)}
.railfoot .today b{display:block;color:var(--rail-ink);font-size:15px}
.rbtn{border:1px solid var(--rail-hover);background:transparent;color:var(--rail-ink);padding:7px 10px;border-radius:8px;text-align:left}
.rbtn.go{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.stage{min-width:0}
.pnav{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 24px;position:sticky;top:0;z-index:5;overflow-x:auto}
.pnav .tab{padding:14px 12px}
.pnav .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:transparent;padding:2px 0;color:var(--company);text-decoration:underline;text-underline-offset:2px;white-space:normal;text-align:left}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
main{padding:24px 28px 48px;min-width:0}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.015em}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:24px}
.stat{padding:14px 16px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;position:relative;cursor:pointer;font:inherit}
.stat:hover,.stat:focus-visible{background:var(--surface-2)}
.stat .tip{display:none;position:absolute;left:12px;right:12px;top:calc(100% + 6px);z-index:10;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;pointer-events:none}
.stat:hover .tip,.stat:focus-visible .tip{display:block}
.stat .go{display:block;font-size:12px;color:var(--company);margin-top:2px}
.stat:first-child{border-left:0;border-radius:10px 0 0 10px}
.stat:last-child{border-radius:0 10px 10px 0}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:8px}
.empty{padding:20px 16px;color:var(--muted)}
.rolecard{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 16px;color:var(--ink)}
.rolecard:first-of-type{border-top:0}
.rolecard .line1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 16px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0;white-space:nowrap}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;margin:2px 4px 2px 0}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.good{color:var(--good);border-color:var(--good)}
.wait{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:6px}
.wait i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.rolehead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.facts{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0 4px;font-size:14px}
.facts span{color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:10px;padding:10px;min-height:140px}
.col h3{font-size:12.5px;margin:0 0 8px;display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;color:var(--ink)}
.card b{display:block;font-size:14px}
.card .small{display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"],.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.38);z-index:40;border:0;padding:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);z-index:41;border-radius:12px;border:1px solid var(--line);padding:22px}
.xclose{float:right}
.sec{margin-top:20px}
.sec > h3{margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;padding:6px 0}
.tl li > i{border-radius:2px}
.who{font-size:12px;font-weight:600}
.fb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.steps{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.steps span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.stagerow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.stagerow .ctl{display:flex;gap:4px}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);font-size:14px}
/* candidate */
.phonewrap{display:grid;grid-template-columns:220px minmax(0,580px);gap:28px;align-items:start;padding:24px 28px}
.plist h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px}
.plist .convo{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:14px}
.plist .convo[aria-current="true"]{background:var(--surface);font-weight:600}
.phone{max-width:380px;border:9px solid var(--ink);border-radius:34px;height:min(740px,calc(100vh - 60px));min-height:540px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.phtabs{display:flex;border-bottom:1px solid var(--line)}
.phtabs button{flex:1;border:0;background:transparent;padding:10px 4px;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px}
.phtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cand);font-weight:600}
.ph-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph-h .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.bub{max-width:84%;padding:8px 11px;border-radius:12px;font-size:14px;white-space:pre-line}
.bub.in{background:var(--surface);align-self:flex-start;border:1px solid var(--line)}
.bub.team{border-color:var(--team)}
.bub.out{background:color-mix(in srgb,var(--cand) 20%,var(--surface));align-self:flex-end}
.bub .meta{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.daysep{align-self:center;font-size:11.5px;color:var(--muted);padding:2px 8px}
.quick{padding:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;background:var(--surface)}
.quick .note{font-size:13px;color:var(--muted);padding:4px}
.chip{border:1px solid var(--cand);color:var(--cand);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;text-align:left}
.chip.solid{background:var(--cand);color:#fff}
.qform{width:100%}
.qform label{margin-top:6px}
.thread{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink)}
.apage{flex:1;overflow-y:auto;padding:16px 14px 20px;background:var(--surface)}
.apage .co{font-size:12.5px;color:var(--muted)}
.prog{list-style:none;padding:0;margin:14px 0 16px;display:flex;flex-direction:column;gap:0}
.prog li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:14px;padding:4px 0;color:var(--muted)}
.prog li .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.prog li.done{color:var(--ink)}
.prog li.done .mk{background:var(--cand);border-color:var(--cand);color:#fff}
.prog li.now{color:var(--ink);font-weight:600}
.prog li.now .mk{border-color:var(--cand)}
.next{border:1px solid var(--cand);border-radius:10px;padding:12px;margin-bottom:12px}
.next h3{margin-bottom:4px}
.next ul{margin:6px 0 0;padding-left:18px;font-size:14px}
/* slack */
.slack{display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh;height:100dvh}
.sside{background:var(--slack-side);color:var(--slack-ink);padding:16px 10px}
.sside .ws{font-weight:700;font-size:16px;padding:0 8px 14px}
.sside h4{font-size:12px;color:var(--slack-muted);margin:10px 8px 4px;font-weight:600}
.sside .ch{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--slack-muted);padding:5px 8px;border-radius:6px;text-align:left}
.sside .ch[aria-current="true"]{background:rgba(255,255,255,.12);color:var(--slack-ink);font-weight:600}
.sside .me{margin-top:18px;padding:0 8px}
.sside .me select{background:transparent;color:var(--slack-ink);border-color:rgba(255,255,255,.25)}
.sside .me option{color:#16212B}
.smain{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.shead{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sfeed{flex:1;overflow-y:auto;padding:12px 20px 40px}
.smsg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.smsg:first-child{border-top:0}
.smsg .av{width:36px;height:36px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.smsg .nm{font-weight:700;font-size:14px}
.smsg .app{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.smsg .tm{font-size:12px;color:var(--muted);margin-left:6px}
.sblock{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin-top:6px;max-width:640px}
.sblock.ai{border-left-color:var(--agent)}
.sblock .ailbl{font-size:12px;font-weight:700;color:var(--agent);margin-bottom:2px}
.sblock ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.sbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;font-weight:600;font-size:13.5px}
.sbtn.go{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sbtn.no{color:var(--bad)}
.sbtn[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.sdone{font-size:13px;color:var(--muted);margin-top:8px}
.srow{border-top:1px solid var(--line);padding:10px 0}
.srow:first-of-type{border-top:0}
.focus{background:color-mix(in srgb,var(--agent) 8%,transparent);border-radius:8px}
/* team */
.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:24px 28px}
.task{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 16px;color:var(--ink)}
.task:first-child{border-top:0}
.task[aria-current="true"]{background:var(--surface-2)}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.check .ok{color:var(--good);font-weight:700}
.check .no{color:var(--line);font-weight:700}
ol.script{padding-left:20px;margin:6px 0 0}
ol.script li{margin-bottom:6px;font-size:14px}
ul.why{margin:6px 0 0;padding-left:18px}
ul.why li{margin-bottom:2px}
@media (max-width:980px){.phonewrap{grid-template-columns:1fr;padding:16px}.plist{display:flex;gap:4px;overflow-x:auto;align-items:center}.plist h3{display:none}.plist .convo{white-space:nowrap;width:auto}.cockpit{grid-template-columns:1fr;padding:16px}.slack{grid-template-columns:1fr;height:auto}.sside{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px}.sside h4,.sside .ws{display:none}.sside .me{margin:0}.sside .ch{width:auto;white-space:nowrap}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}

.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0}
.phead p{color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px;vertical-align:2px}

X.advance = () => {
  S.day++;
  const d = S.day;
  for (const a of S.apps) {
    if (a.held) continue;
    if (a.status === 'contacted' && a.firstOut != null) {
      const replied = a.lastReply != null && a.lastReply >= a.firstOut;
      const since = d - a.firstOut;
      if (!replied) {
        if (since >= 2 && a.followups === 0) { a.followups = 1; edge(5); say(a, 'agent', `Hi ${first(a)}, just bumping this in case it got buried.`); ev(a, 'agent', 'Follow-up 1 sent (no reply in 2 days)'); }
        else if (since >= 5 && a.followups === 1) { a.followups = 2; edge(5); say(a, 'agent', `Last note from me, ${first(a)}. If now isn't the right time, no problem.`); ev(a, 'agent', 'Follow-up 2 sent (no reply in 5 days)'); }
        else if (since >= 7 && a.followups === 2) { edge(5); closeApp(a, 'No reply after 2 follow-ups', 'agent', {silent:true}); }
      }
    }
    if (a.status === 'interviewing' && !a.paused) {
      if (a.step === 'scheduled' && a.slot && d >= a.slot.d) interviewHappened(a);
      else if (a.step === 'feedback' || a.step === 'th_review') hmOverdue(a);
      else if (a.step === 'takehome' && a.thDue != null && d > a.thDue) {
        if (a.thRem === 0) { a.thRem = 1; edge(15); say(a, 'agent', `Hi ${first(a)}, gentle reminder: the take-home was due ${fd(a.thDue)}. Need more time? Just reply.`, 'Reminder: your take-home'); ev(a, 'agent', 'Take-home late: reminder sent'); }
        else if (a.thRem === 1 && d > a.thDue + 2) { a.thRem = 2; edge(15); addTask({type:'th_missing', appId:a.id, roleId:a.roleId, title:`${P(a.pid).name} hasn't sent the take-home`, why:`Was due ${fd(a.thDue)}. One reminder sent.`}); ev(a, 'agent', 'Take-home still missing: passed to a HireLoop recruiter'); }
      }
    }
    if (a.status === 'shortlist_hm') hmOverdue(a);
    if (a.status === 'offer' && a.step === 'hm') hmOverdue(a);
    if (a.status === 'notice') {
      if (a.step === 'ok' && d < a.joinDate && d - (a.lastCheckin ?? d) >= 7) { a.checkins++; a.lastCheckin = d; say(a, 'agent', checkinText(a), 'Before you join Acme'); ev(a, 'agent', 'Notice-period check-in sent'); }
      const lastHeard = Math.max(a.lastReply ?? -999, a.acceptDay ?? -999);
      if (a.step === 'ok' && !a.quietFlag && a.checkins > 0 && d - lastHeard >= 7) {
        a.quietFlag = true; a.step = 'risk'; edge(19);
        addTask({type:'risk', appId:a.id, roleId:a.roleId, title:`${P(a.pid).name} has gone quiet before joining`, why:`No reply for ${d - lastHeard} days. Joins ${fd(a.joinDate)}.`});
        ev(a, 'agent', 'Quiet for 7+ days before joining: passed to a HireLoop recruiter');
      }
    }
  }
  toast(`It's now ${fd(d)}`);
};

/* --- Roles --- */
X.findCandidates = v => {
  const r = R(v);
  if (r.status !== 'Open') { toast(`This role is ${r.status.toLowerCase()}.`); return; }
  const pool = /product manager/i.test(r.title) ? POOL_PM : POOL_GEN;
  const have = new Set(S.apps.filter(a => a.roleId === r.id).map(a => a.pid));
  const added = [], skipped = [], merged = [];
  for (const pid of pool) {
    if (have.has(pid)) continue;
    const p = P(pid);
    if (activeFlag(p)) { skipped.push(p.name); edge(1); continue; }
    if (p.generic) p.headline = `${r.title}, ${p.co}`;
    if (p.generic && !p.scr.exp) p.scr.exp = Math.round((r.min + r.max) / 2);
    const a = mkApp(pid, r.id, 'sourced', 'review', {reviewed:false});
    if (p.src.length > 1) { merged.push(p.name); edge(2); a.tags.push('Duplicate merged'); }
    const other = S.apps.find(x => x.pid === pid && x.roleId !== r.id && isActive(x));
    if (other) { a.tags.push('Also in ' + R(other.roleId).title); edge(3); }
    if (p.feedback.length) { a.tags.push('Past feedback'); edge(4); }
    ev(a, 'agent', `Found on ${p.src.join(' and ')}. Match ${p.match}%.`);
    added.push(a);
  }
  r.runs++;
  if (!added.length) { logRole(r.id, 'agent', 'Searched again: no new matches.'); toast('No new matches.'); return; }
  skipped.forEach(n => r.skipped.push({name:n, d:S.day}));
  logRole(r.id, 'agent', `Searched Naukri, LinkedIn, referrals and past applicants: ${added.length} added${skipped.length ? `, ${skipped.length} skipped (flagged)` : ''}${merged.length ? `, ${merged.length} duplicate merged` : ''}.`);
  addTask({type:'review', roleId:r.id, title:`Check ${added.length} new candidates`, why:`${r.title}. Remove misfits before the AI messages them.`});
  ui.roleTab = 'pipeline';
  toast(`${added.length} found${skipped.length ? `, ${skipped.length} skipped (flagged)` : ''}. A HireLoop recruiter checks them next.`);
};
X.roleStatus = v => {
  const [id, st] = two(v); const r = R(id);
  if (st === 'hold') {
    r.status = 'On hold';
    S.apps.filter(a => a.roleId === id && isActive(a)).forEach(a => { a.held = true; if (a.msgs.length) say(a, 'agent', `Quick update, ${first(a)}: Acme has paused this role. I'll let you know when it reopens.`, 'Update on your application'); ev(a, 'company', 'Role on hold: AI paused'); });
    logRole(id, 'company', 'Role on hold. AI paused.'); toast('Role paused. Candidates told.');
  } else if (st === 'open') {
    r.status = 'Open';
    S.apps.filter(a => a.roleId === id && isActive(a)).forEach(a => { a.held = false; if (a.msgs.length) say(a, 'agent', `Good news, ${first(a)}: Acme has reopened the ${r.title} role.`, 'Update on your application'); ev(a, 'company', 'Role reopened'); });
    logRole(id, 'company', 'Role reopened.'); toast('Role reopened.');
  } else if (st === 'close') {
    r.status = 'Closed';
    S.apps.filter(a => a.roleId === id && isActive(a)).forEach(a => { a.held = false; closeApp(a, 'Role closed', 'company', {msg:`Hi ${first(a)}, Acme has closed the ${r.title} role, so we're ending this process. Thank you for your time.\n\nCan we keep you in mind for future roles?`}); });
    logRole(id, 'company', 'Role closed. Everyone still active was told.'); toast('Role closed.');
  }
};

  else { say(a, 'cand', 'Do you offer relocation support?'); say(a, 'agent', "Good question. I don't want to guess, so I'm checking with Acme. You'll hear back today."); edge(9); addTask({type:'question', appId:a.id, roleId:a.roleId, q:'Do you offer relocation support?', title:`Answer ${P(a.pid).name}'s question`, why:'"Do you offer relocation support?" The AI didn\'t know.'}); ev(a, 'agent', 'Couldn\'t answer a question: passed to a HireLoop recruiter'); }

/* --- HireLoop recruiter --- */
X.openTask = v => { ui.task = v; };
X.tf = (v, el) => { ui.tf[el.dataset.k] = v; ui.task = null; };
X.reassign = (v, el) => { const t = S.tasks.find(x => x.id === el.dataset.k); t.assignee = v; toast(`Reassigned to ${v}.`); };
X.resolve = v => {
  const [tid, out] = two(v); const t = S.tasks.find(x => x.id === tid); const a = t.appId ? A(t.appId) : null; const r = t.roleId ? R(t.roleId) : null;
  const note = (document.getElementById('t-note') || {}).value || '';
  if (t.ext) { t.done = true; t.doneD = S.day; t.outcome = note.trim() ? `Done: ${note.trim()}` : 'Done'; ui.task = null; toast(`Done. ${t.client} can see the update.`); return; }
  switch (t.type) {
    case 'intake':
      if (!note.trim()) { toast('Add the notes first.'); return; }
      r.intake = note.trim(); logRole(r.id, 'team', `${t.assignee} added notes from a call with the ${r.hm}`); break;
    case 'review': {
      const apps = S.apps.filter(x => x.roleId === r.id && x.status === 'sourced' && !x.reviewed);
      let kept = 0;
      apps.forEach(x => { const box = document.getElementById('keep-' + x.id); const keep = box ? box.checked : true; x.reviewed = true;
        if (!keep) { closeApp(x, 'Removed in quality check', 'team', {silent:true}); return; }
        kept++; ev(x, 'team', 'Approved in quality check'); if (gate(x, 'outreach')) doOutreach(x); });
      logRole(r.id, 'team', `${t.assignee} approved ${kept} of ${apps.length}. Messages sent.`); t.outcome = `Kept ${kept} of ${apps.length}`; break; }
    case 'question':
      if (!note.trim()) { toast('Write the answer first.'); return; }
      say(a, 'team', note.trim()); ev(a, 'team', `Answered: "${t.q}"`); break;
    case 'receipt': ev(a, 'team', 'Called: take-home received, no questions'); break;
    case 'th_missing':
      if (out === 'extend') { a.thDue = S.day + 3; a.thRem = 0; say(a, 'team', `Hi ${first(a)}, as discussed, your new deadline is ${fd(a.thDue)}. Good luck! – ${t.assignee}, HireLoop`); ev(a, 'team', `Deadline extended to ${fd(a.thDue)}`); }
      else closeApp(a, "Didn't send the take-home", 'team'); break;
    case 'resched':
      if (out === 'book') { const s = {d:S.day + 2, time:'12:00'}; bookSlot(a, s); say(a, 'team', `Hi ${first(a)}, as discussed, you're booked for ${fd(s.d)} at 12:00. – ${t.assignee}, HireLoop`); ev(a, 'team', `Booked ${fd(s.d)}, 12:00 by phone`); }
      else closeApp(a, 'Withdrew during scheduling', 'team', {silent:true}); break;
    case 'negotiation':
      if (out === 'won') { a.offer.ctc += 2; a.paused = false; a.status = 'notice'; a.step = 'ok'; a.joinDate = a.offer.join; a.acceptDay = S.day; a.lastCheckin = S.day; say(a, 'team', `Great speaking with you, ${first(a)}. Confirming the revised offer of ${lpa(a.offer.ctc)}. Welcome to Acme! – ${t.assignee}, HireLoop`); ev(a, 'team', `Negotiated: ${lpa(a.offer.ctc)} accepted`); }
      else closeApp(a, 'Declined after negotiation', 'team', {silent:true}); break;
    case 'risk':
      if (out === 'ok') { a.step = 'ok'; a.quietFlag = false; a.lastReply = S.day; say(a, 'team', `Lovely chatting today, ${first(a)}. See you on ${fd(a.joinDate)}! – ${t.assignee}, HireLoop`); ev(a, 'team', 'Called: still joining'); }
      else closeApp(a, 'Withdrew before joining', 'team', {silent:true}); break;
    case 'call': ev(a, 'team', 'Called the candidate'); break;
  }
  t.done = true; t.doneD = S.day; t.outcome = t.outcome || ({extend:'Deadline extended', drop:'Closed', book:'Booked by phone', withdrew:'Withdrew', won:'Revised offer accepted', lost:'Lost', ok:'Still joining'}[out] || 'Done');
  ui.task = null; toast('Done. Acme can see the update.');
};

/* ============ View helpers ============ */
const btn = (label, a, v, cls, dis) => `<button class="btn ${cls || ''}" data-a="${a}" data-v="${esc(v ?? '')}"${dis ? ' disabled' : ''}>${esc(label)}</button>`;
const sbtn = (label, a, v, cls, pressed) => `<button class="sbtn ${cls || ''}" data-a="${a}" data-v="${esc(v ?? '')}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''}>${esc(label)}</button>`;
const head = (title, line, right) => `<div class="phead"><div><h1>${esc(title)}</h1><p>${esc(line)}</p></div>${right || ''}</div>`;
const actorTag = actor => `<span class="who" style="color:${ACT[actor].c}">${ACT[actor].label}</span>`;
const ownerTag = r => isAdmin() && r && RECS[r.owner] ? `<span class="owner">${RECS[r.owner].name}</span>` : '';
function waitOn(a){
  const r = R(a.roleId);
  if (a.held) return ['company','Role paused'];
  if (a.pending) return ['company',`Needs ${RN(r)}'s approval`];
  switch (a.status) {
    case 'sourced': return ['team','HireLoop checking'];
    case 'contacted': return ['cand', a.followups ? `No reply (${a.followups} follow-up${a.followups > 1 ? 's' : ''})` : 'Waiting for reply'];
    case 'screening': return a.step === 'decide' ? ['company',`${RN(r)}'s call`] : ['cand','Answering questions'];
    case 'ready': return ['company','Ready to send'];
    case 'shortlist_hm': return ['hm',`Hiring manager deciding${a.rem ? ' (late)' : ''}`];
    case 'interviewing':
      if (a.step === 'scheduling') return ['cand','Picking a time'];
      if (a.step === 'resched_help') return ['team','HireLoop finding a time'];
      if (a.step === 'scheduled') return ['agent',`Interview ${fds(a.slot.d)}, ${a.slot.time}`];
      if (a.step === 'feedback') return ['hm',`Feedback due${a.rem ? ' (late)' : ''}`];
      if (a.step === 'takehome') return ['cand',`Take-home due ${fds(a.thDue)}`];
      if (a.step === 'th_review') return ['hm',`Take-home review${a.rem ? ' (late)' : ''}`];
      return ['agent','In progress'];
    case 'offer': return ({draft:['company', a.offer && a.offer.comment ? 'Changes asked' : 'Draft offer'], admin:['company','Needs Head of Talent'], hm:['hm',`Hiring manager approving${a.rem ? ' (late)' : ''}`], sent:['cand','Deciding on offer'], negotiation:['team','HireLoop negotiating']})[a.step] || ['agent','Offer'];
    case 'notice':
      if (a.step === 'datechange') return ['company','Approve new date'];
      if (S.day >= a.joinDate) return ['company','Joining today'];
      if (a.step === 'risk') return ['team','HireLoop calling'];
      return ['agent',`Joins ${fds(a.joinDate)}`];
    case 'joined': return ['company',`Joined ${fds(a.joinDate)}`];
    case 'closed': return ['company', a.closed.reason];
  }
  return ['agent',''];
}
const waitHTML = a => { const [who, txt] = waitOn(a); return `<span class="wait" style="color:${ACT[who].c}"><i style="background:${ACT[who].c}"></i>${esc(txt)}</span>`; };
const tagHTML = t => `<span class="tag ${/Over budget|Long notice|Location/.test(t) ? 'warn' : ''}">${esc(t)}</span>`;

function attention(scope){
  const admin = scope === 'admin';
  const roles = scope === 'admin' ? S.roles : S.roles.filter(r => r.owner === scope);
  const ids = new Set(roles.map(r => r.id));
  const items = [];
  roles.forEach(r => {
    const ready = S.apps.filter(a => a.roleId === r.id && a.status === 'ready');
    if (ready.length) items.push({r, tone:'company', text:`Send ${ready.length} candidate${ready.length > 1 ? 's' : ''} to the ${r.hm}`, sub:r.title, acts:[['Send shortlist','sendShortlist',r.id,'primary'],['View','openRole',r.id,'']]});
    const po = S.apps.filter(a => a.roleId === r.id && a.pending === 'outreach');
    if (po.length) items.push({r, tone:'agent', text:`Approve first messages to ${po.length} candidates`, sub:`${r.title} · you asked the AI to check with you first`, acts:[['Approve','approveOutreach',r.id,'primary'],['View','openRole',r.id,'']]});
  });
  S.apps.filter(a => ids.has(a.roleId)).forEach(a => {
    const r = R(a.roleId), p = P(a.pid);
    if (a.pending && a.pending !== 'outreach') items.push({r, tone:'agent', text:`Approve: ${KIND_LABEL[a.pending]} for ${p.name}`, sub:r.title, acts:[['Approve','approvePending',a.id,'primary'],['View','openApp',a.id,'']]});
    if (a.status === 'screening' && a.step === 'decide') items.push({r, tone:'warn', text:`${p.name} is ${a.tags.filter(t => /budget|notice|Location/.test(t)).join(', ').toLowerCase()}. Include?`, sub:`${r.title} · expects ${lpa(a.screen.exp)} (max ${lpa(r.max)}) · notice ${a.screen.notice} days (max ${r.maxNotice})`, acts:[['Include','decide',a.id + '|1','primary'],['Close','decide',a.id + '|0',''],['View','openApp',a.id,'']]});
    if (a.status === 'offer' && a.step === 'draft') items.push({r, tone:'company', text: a.offer && a.offer.comment ? `Revise ${p.name}'s offer` : `Draft an offer for ${p.name}`, sub: a.offer && a.offer.comment ? a.offer.comment : `${r.title} · cleared all rounds`, acts:[[a.offer ? 'Revise offer' : 'Draft offer','offerModal',a.id,'primary'],['View','openApp',a.id,'']]});
    if (a.status === 'offer' && a.step === 'admin' && admin) items.push({r, tone:'warn', approval:true, text: admin ? `Approve above-budget offer: ${p.name}, ${lpa(a.offer.ctc)}` : `${p.name}'s offer is with the Head of Talent`, sub:`${r.title} · budget max ${lpa(r.max)}${a.offer.note ? ' · ' + a.offer.note : ''}`, acts: admin ? [['Approve','adminOffer',a.id + '|1','primary'],['Send back','adminOffer',a.id + '|0',''],['View','openApp',a.id,'']] : [['View','openApp',a.id,'']]});
    if (a.rem === 2 && ['shortlist_hm','interviewing','offer'].includes(a.status)) { const who = a.status === 'interviewing' && a.step === 'feedback' ? stageHM(a) : r.hm; items.push({r, tone:'bad', text:`${who} is 2 days late on ${p.name}`, sub:waitOn(a)[1], acts:[['Nudge again','nudge',a.id,'primary'],['View','openApp',a.id,'']]}); }
    if (a.status === 'notice' && a.step === 'datechange') items.push({r, tone:'warn', text:`${p.name} wants to join on ${fds(a.newJoin)} instead of ${fds(a.joinDate)}`, sub:r.title, acts:[['Approve','approveDate',a.id + '|1','primary'],['Keep original','approveDate',a.id + '|0','']]});
    if (a.status === 'notice' && a.step !== 'datechange' && S.day >= a.joinDate) items.push({r, tone:'good', text:`Did ${p.name} join today?`, sub:r.title, acts:[['Joined','markJoined',a.id,'primary'],['Did not join','didNotJoin',a.id,'']]});
    if (a.status === 'closed' && a.suggestFlag && !S.hidden.includes('flag-' + a.id)) items.push({r, tone:'bad', text:`${p.name} missed two interviews. Hide from future shortlists?`, sub:r.title, acts:[['Flag','flagModal',a.pid + '|' + a.id,'danger'],['Dismiss','dismiss','flag-' + a.id,'']]});
    if (a.status === 'closed' && /^Declined/.test(a.closed.reason) && !S.hidden.includes('dec-' + a.id) && r.status === 'Open') {
      const next = S.apps.filter(x => x.roleId === r.id && ['offer','interviewing','shortlist_hm','ready'].includes(x.status)).sort((x, y) => P(y.pid).match - P(x.pid).match)[0];
      items.push({r, tone:'warn', text:`${p.name} declined. ${r.seats - r.filled} seats still open.`, sub: next ? `Next best: ${P(next.pid).name}` : 'Nobody else is far along.', acts:[next ? ['View next best','openApp',next.id,'primary'] : ['Find candidates','findCandidates',r.id,'primary'],['Dismiss','dismiss','dec-' + a.id,'']]});
    }
  });
  return items;
}
const toneColor = t => ({company:'var(--company)', agent:'var(--agent)', warn:'var(--warn)', bad:'var(--bad)', good:'var(--good)'})[t] || 'var(--muted)';
const attnHTML = (items, empty) => items.length ? items.map(it => `<div class="item"><span class="dot" style="background:${toneColor(it.tone)}"></span><div class="body"><p>${esc(it.text)}${ownerTag(it.r)}</p>${it.sub ? `<p class="small muted">${esc(it.sub)}</p>` : ''}${it.acts.length ? `<div class="acts">${it.acts.map(x => btn(x[0], x[1], x[2], 'sm ' + (x[3] || ''))).join('')}</div>` : ''}</div></div>`).join('') : `<p class="empty">${empty || 'Nothing to do.'}</p>`;

function funnel(r){
  const apps = S.apps.filter(a => a.roleId === r.id);
  const g = {early:0, mid:0, late:0, joined:0};
  apps.forEach(a => { if (['sourced','contacted','screening'].includes(a.status)) g.early++; else if (['ready','shortlist_hm','interviewing'].includes(a.status)) g.mid++; else if (['offer','notice'].includes(a.status)) g.late++; else if (a.status === 'joined') g.joined++; });
  const tot = Math.max(1, g.early + g.mid + g.late + g.joined);
  return `<div class="bar" aria-hidden="true"><i style="width:${g.early / tot * 100}%;background:var(--agent);opacity:.55"></i><i style="width:${g.mid / tot * 100}%;background:var(--company)"></i><i style="width:${g.late / tot * 100}%;background:var(--warn)"></i><i style="width:${g.joined / tot * 100}%;background:var(--good)"></i></div>`;
}

function candOpts(a){
  if (a.held) return {note:'Acme has paused this role.'};
  if (a.status === 'closed') {
    if (a.declineAsk) return {chips:[['Took another offer','c_reason','another'],['Pay','c_reason','comp'],['Role fit','c_reason','fit']]};
    if (a.consentAsk) return {chips:[['Yes, keep me in mind','c_consent','1'],['No, thanks','c_consent','0']]};
    return {note:'Conversation ended.'};
  }
  if (ui.ask === a.id) return {chips:[['Is it hybrid?','c_q','mode'],['Salary range?','c_q','salary'],['Relocation support?','c_q','reloc'],['Back','c_askclose','']]};
  switch (a.status) {
    case 'sourced': return {note:'Not contacted yet.'};
    case 'contacted': return {chips:[['Yes, interested','c_yes'],['Not interested','c_no'],['Ask a question','c_ask'],['Stop messages','c_stop']]};
    case 'screening': return a.step === 'questions' ? {form:'screen'} : {chips:[['Ask a question','c_ask']]};
    case 'ready': case 'shortlist_hm': return {chips:[['Ask a question','c_ask']]};
    case 'interviewing':
      if (a.pending) return {note:'Waiting on Acme.'};
      if (a.step === 'scheduling' && a.slots.length) return {chips:a.slots.map((s, i) => [`${fd(s.d)}, ${s.time}`,'c_slot',String(i)]).concat([['None of these work','c_noslot']])};
      if (a.step === 'scheduled') return {chips:[['Can we reschedule?','c_resched'],['Ask a question','c_ask']]};
      if (a.step === 'takehome') return {chips:[['Got it, thanks','c_thgot'],['Need more time','c_thmore'],['Submit assignment','c_thsub']]};
      if (a.step === 'resched_help') return {note:'A recruiter will call you.'};
      return {chips:[['Ask a question','c_ask']]};
    case 'offer':
      if (a.step === 'sent') return {chips:[['Accept offer','c_accept'],['Decline','c_decline'],['I have another offer','c_counter'],['Talk to a person','c_person']]};
      if (a.step === 'negotiation') return {note:'A recruiter will call you.'};
      return {chips:[['Ask a question','c_ask']]};
    case 'notice':
      if (a.step === 'datechange') return {note:'Waiting for Acme to confirm.'};
      return {chips:[['All good, see you soon','c_ngood'],["I'm rethinking this",'c_nre'],['Move my joining date?','c_ndate']]};
    case 'joined': return {note:'Welcome to Acme!'};
  }
  return {note:''};
}
